server:
  port: 8081

spring:
  application:
    name: schedulerx
  datasource:
    url: jdbc:mysql://localhost:3306/schedulerx?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mogu.data.schedulerx.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

schedulerx:
  callback:
    base-url: http://localhost:8081
